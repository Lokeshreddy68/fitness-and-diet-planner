# Spring Boot Properties
server.port=8081
spring.application.name=fitness-planner-app

# --- Database Properties (MySQL) ---
# Replace 'localhost', '3306', 'fitness_planner_db' with your MySQL server details if different.
# Ensure the database 'fitness_planner_db' exists or your MySQL user has rights to create it if ddl-auto is 'create' or 'create-drop'.
spring.datasource.url=jdbc:mysql://localhost:3306/fitness_planner_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# Replace with your MySQL username and password
spring.datasource.username=root
spring.datasource.password=22a81a4381

# JPA / Hibernate Properties
# For production, 'validate' or 'none' is recommended after initial schema creation.
# 'update' can be used during development but be cautious with existing data.
# 'create' or 'create-drop' will recreate schema on startup (data loss).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Show SQL queries in logs, useful for debugging
# Use an appropriate MySQL dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Or MySQL5InnoDBDialect if using older MySQL
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Properties
spring.thymeleaf.cache=false
# Disable caching for development
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Spring Security
# spring.security.user.name=user # Default user, will be replaced by database auth
# spring.security.user.password=password
# spring.security.user.roles=USER

# File Upload (if needed later, e.g., for profile pictures)
# spring.servlet.multipart.max-file-size=10MB
# spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.org.springframework=INFO
# Set your app's root package to DEBUG for more logs
logging.level.com.fitnessplanner=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# To see SQL query parameters
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
